name: "Story"
description: A user-facing capability described as a story. Contains task sub-issues.
title: "[STORY] "
labels: ["type:story"]

body:
  - type: markdown
    attributes:
      value: |
        A **Story** describes a capability from the user's perspective.
        Tasks are created as sub-issues beneath this story.

  - type: textarea
    id: description
    attributes:
      label: description
      description: What does this story accomplish?
      placeholder: ""
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Specific, testable conditions that must be true for this story to be done.
      placeholder: ""
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: notes
      description: Any edge cases, dependencies on other stories, or implementation hints.
      placeholder: "Optional."
    validations:
      required: false
