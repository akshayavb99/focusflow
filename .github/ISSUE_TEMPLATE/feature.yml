name: "Feature"
description: A major feature area grouping related user stories.
title: "[FEAT] "
labels: ["type:feature"]

body:
  - type: markdown
    attributes:
      value: |
        A **Feature** is a top-level grouping of related user stories.
        It has no tasks directly — stories sit beneath it as sub-issues.

  - type: input
    id: feature-id
    attributes:
      label: Feature ID
      description: Reference ID from the backlog document.
      placeholder: "e.g. FEAT-02"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What does this feature deliver? Who benefits and why?
      placeholder: "This feature enables the user to..."
    validations:
      required: true

  - type: textarea
    id: stories
    attributes:
      label: Constituent Stories
      description: List the story issue numbers once created. Update as you add them.
      placeholder: |
        - [ ] #0 US-05 · Start a timer
        - [ ] #0 US-06 · Pause and resume
        - [ ] #0 US-07 · Stop and save
    validations:
      required: false

  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which application module does this feature belong to?
      options:
        - sessions
        - goals
        - assessments
        - analytics
        - infra
    validations:
      required: true

  - type: textarea
    id: definition-of-done
    attributes:
      label: Definition of Done
      description: How do we know this feature is complete?
      placeholder: |
        - [ ] All constituent stories are closed
        - [ ] Feature is accessible on Render.com public URL
        - [ ] No cross-module DB joins introduced
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Architectural Notes
      description: Any design decisions, trade-offs, or constraints relevant to this feature.
      placeholder: "Optional — link to PRD section, ADR, or architectural diagram."
    validations:
      required: false
