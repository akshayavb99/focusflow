name: "Task"
description: A single unit of technical work. Sub-issue of a story.
title: "[TASK] "
labels: ["type:task"]

body:
  - type: markdown
    attributes:
      value: |
        A **Task** is one discrete technical unit of work scoped to a single layer.
        It is always a sub-issue of a Story — never standalone.

  - type: textarea
    id: implementation-details
    attributes:
      label: implementation-details
      description: What exactly needs to be built or done? Be specific.
      placeholder: ""
    validations:
      required: true

  - type: textarea
    id: success-criteria
    attributes:
      label: success-criteria
      description: How do you know this task is complete?
      placeholder: ""
    validations:
      required: true
